<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reading: {{ book.title }} — Anuvad.ai</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@700&f[]=satoshi@500,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ff-display: 'Clash Display', sans-serif;
            --ff-body: 'Satoshi', sans-serif;
            /* Default Dark Theme */
            --bg-body: #0a0a0b;
            --bg-nav: rgba(10, 10, 11, 0.9);
            --bg-panel: #111113;
            --bg-pdf: #161618;
            --border: rgba(255,255,255,0.06);
            --text: #f0f0f0;
            --text-muted: #9ca3af;
            --accent: #8b5cf6;
            --pdf-invert: 0.88;
            --pdf-hue: 180deg;
            --pdf-contrast: 1.1;
        }

        body.theme-light {
            --bg-body: #f2f2f2;
            --bg-nav: rgba(242, 242, 242, 0.9);
            --bg-panel: #ffffff;
            --bg-pdf: #e5e5e5;
            --border: rgba(0,0,0,0.1);
            --text: #111111;
            --text-muted: #6b7280;
            --accent: #6366f1;
            --pdf-invert: 0;
            --pdf-hue: 0deg;
            --pdf-contrast: 1;
        }

        body.theme-sepia {
            --bg-body: #f4ecd8;
            --bg-nav: rgba(244, 236, 216, 0.9);
            --bg-panel: #fbf0d9;
            --bg-pdf: #e9dec1;
            --border: rgba(139, 107, 77, 0.2);
            --text: #5b4636;
            --text-muted: #8b6b4d;
            --accent: #d97706;
            --pdf-invert: 0.1;
            --pdf-hue: 30deg;
            --pdf-contrast: 0.9;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--ff-body); background: var(--bg-body); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; transition: background 0.3s, color 0.3s; }

        /* Progress Bar Top */
        #progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); z-index: 10000; width: 0%; transition: width 0.3s; }

        /* Top Nav */
        .top-nav {
            height: 72px; background: var(--bg-nav); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 100;
        }
        
        .nav-left { display: flex; align-items: center; gap: 16px; min-width: 240px; }
        .back-btn { color: var(--text-muted); text-decoration: none; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; transition: color 0.2s; }
        .back-btn:hover { color: var(--text); }
        .book-title { font-family: var(--ff-display); font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; color: var(--text); }

        /* Center Nav */
        .nav-center { display: flex; align-items: center; gap: 12px; }
        .btn-page { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .btn-page:hover { background: var(--border); }
        .btn-page:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .page-input-wrapper { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--text-muted); }
        .page-input { width: 50px; background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 6px 0; text-align: center; color: var(--text); font-weight: 700; font-family: inherit; outline: none; }
        .page-input:focus { border-color: var(--accent); }
        
        .btn-bookmark { background: transparent; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); transition: color 0.2s; margin-left: 8px; }
        .btn-bookmark.active { color: var(--accent); }

        /* Right Nav */
        .nav-right { display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-width: 240px; }
        
        .theme-toggle { display: flex; background: rgba(0,0,0,0.1); border-radius: 999px; border: 1px solid var(--border); overflow: hidden; padding: 2px; }
        .theme-toggle button { background: transparent; border: none; color: var(--text-muted); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .theme-toggle button.active { background: var(--border); color: var(--text); }
        
        .lang-toggle { display: flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
        .lang-toggle button { background: transparent; border: none; color: var(--text-muted); font-size: 12px; font-weight: 700; padding: 8px 16px; cursor: pointer; transition: all 0.2s; }
        .lang-toggle button.active { background: var(--text); color: var(--bg-body); }

        /* Split Screen */
        .reader-workspace { display: flex; flex: 1; overflow: hidden; }
        
        /* PDF Side */
        .pdf-side { flex: 1; background: var(--bg-pdf); display: flex; justify-content: center; align-items: flex-start; padding: 40px; overflow: auto; border-right: 1px solid var(--border); }
        #pdf-canvas { border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); filter: invert(var(--pdf-invert)) hue-rotate(var(--pdf-hue)) contrast(var(--pdf-contrast)); transition: filter 0.3s; }
        
        /* Translation Side */
        .translation-side { flex: 1; background: var(--bg-panel); display: flex; flex-direction: column; overflow: hidden; }
        .translation-header { padding: 24px 40px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .translation-title { font-family: var(--ff-display); font-size: 24px; font-weight: 700; }
        
        .translation-actions { display: flex; gap: 8px; }
        .btn-icon { background: transparent; border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .btn-icon:hover { background: var(--border); }
        .btn-play { padding: 0 16px; width: auto; font-size: 13px; font-weight: 700; gap: 8px; border-radius: 999px; }
        
        .translation-content-area { flex: 1; padding: 40px; overflow-y: auto; font-size: 18px; line-height: 1.8; position: relative; }
        
        #translated-text { display: none; }
        
        .loader { display: none; position: absolute; inset: 0; background: var(--bg-panel); flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        .loader.active { display: flex; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(139,92,246,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Error state */
        .error-state { color: #ef4444; background: rgba(239,68,68,0.1); padding: 16px; border-radius: 12px; font-size: 14px; font-weight: 600; text-align: center; }

        /* Notes Drawer */
        .notes-drawer {
            position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg-nav); backdrop-filter: blur(12px);
            border-top: 1px solid var(--border); padding: 24px 40px; transform: translateY(100%); transition: transform 0.3s;
            z-index: 50; display: flex; flex-direction: column; gap: 16px;
        }
        .notes-drawer.open { transform: translateY(0); }
        .notes-drawer h3 { font-family: var(--ff-display); font-size: 18px; }
        .notes-textarea { width: 100%; background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text); font-family: var(--ff-body); outline: none; resize: vertical; min-height: 80px; }
        .notes-textarea:focus { border-color: var(--accent); }
        .notes-actions { display: flex; justify-content: flex-end; gap: 8px; }
        .btn-save-note { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; }
        .btn-cancel-note { background: transparent; color: var(--text-muted); border: none; font-weight: 700; cursor: pointer; padding: 8px 16px; }

        /* Chat FAB */
        .fab-chat {
            position: fixed; bottom: 32px; right: 32px; width: 56px; height: 56px;
            background: var(--accent); color: #fff; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; cursor: pointer; border: none;
            box-shadow: 0 10px 24px rgba(139,92,246,0.4); z-index: 200; transition: transform 0.2s;
        }
        .fab-chat:hover { transform: scale(1.05); }

    </style>
</head>
<body>
    <div id="progress-bar"></div>

    <!-- Navigation -->
    <nav class="top-nav">
        <div class="nav-left">
            <a href="{% url 'dashboard' %}" class="back-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Back
            </a>
            <div class="book-title">{{ book.title }}</div>
        </div>

        <div class="nav-center">
            <button class="btn-page" id="btn-prev">Prev</button>
            <div class="page-input-wrapper">
                Page <input type="number" id="input-page" class="page-input" value="1" min="1"> of <span id="total-pages">-</span>
            </div>
            <button class="btn-page" id="btn-next">Next</button>
            <button class="btn-bookmark" id="btn-bookmark" title="Bookmark Page">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            </button>
        </div>

        <div class="nav-right">
            <div class="theme-toggle">
                <button data-theme="light" title="Light Theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></button>
                <button data-theme="dark" class="active" title="Dark Theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
                <button data-theme="sepia" title="Sepia Theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></button>
            </div>
            
            <div class="lang-toggle">
                <button data-lang="english">ENG</button>
                <button data-lang="hindi" class="active">HINDI</button>
                <button data-lang="hinglish">HINGLISH</button>
            </div>
        </div>
    </nav>

    <!-- Workspace -->
    <div class="reader-workspace">
        <div class="pdf-side" id="pdf-container">
            <canvas id="pdf-canvas"></canvas>
        </div>

        <div class="translation-side">
            <div class="translation-header">
                <div class="translation-title">Translation</div>
                <div class="translation-actions">
                    <button class="btn-icon" id="btn-font-minus">A-</button>
                    <button class="btn-icon" id="btn-font-plus">A+</button>
                    <button class="btn-icon btn-play" id="btn-tts">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        Listen
                    </button>
                </div>
            </div>

            <div class="translation-content-area">
                <div class="loader" id="loader">
                    <div class="spinner"></div>
                    <div style="color: var(--text-muted); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; font-size: 13px;">Translating page...</div>
                </div>
                <div id="translated-text"></div>
            </div>

            <!-- Notes Drawer for Bookmarks -->
            <div class="notes-drawer" id="notes-drawer">
                <h3>Page Notes</h3>
                <textarea class="notes-textarea" id="notes-input" placeholder="Jot down quick thoughts about this page..."></textarea>
                <div class="notes-actions">
                    <button class="btn-cancel-note" onclick="document.getElementById('notes-drawer').classList.remove('open')">Close</button>
                    <button class="btn-save-note" id="btn-save-note">Save Note</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        const BOOK_ID = {{ book.id }};
        const CSRF_TOKEN = '{{ csrf_token }}';
        const PDF_URL = '{{ book.pdf_file.url }}';
        const START_PAGE = parseInt('{{ current_page }}') || 1;
        const BOOKMARKS = JSON.parse('{{ bookmarks_json|safe }}' || '[]');
        
        let pdfDoc = null;
        let pageNum = START_PAGE;
        let isRendering = false;
        let pendingPage = null;
        let currentLang = 'hindi';
        let currentText = '';
        let audio = new Audio();
        let fontSize = 18;
        
        // DOM Elements
        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        const scale = 1.5;
        
        const loader = document.getElementById('loader');
        const translatedDiv = document.getElementById('translated-text');
        const progressBar = document.getElementById('progress-bar');
        const inputPage = document.getElementById('input-page');
        const totalPagesEl = document.getElementById('total-pages');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnBookmark = document.getElementById('btn-bookmark');
        
        // Init PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        
        pdfjsLib.getDocument(PDF_URL).promise.then(doc => {
            pdfDoc = doc;
            totalPagesEl.textContent = pdfDoc.numPages;
            renderPage(pageNum);
        }).catch(err => {
            console.error('PDF Load Error:', err);
            translatedDiv.innerHTML = '<div class="error-state">Failed to load PDF file.</div>';
            translatedDiv.style.display = 'block';
        });

        function queueRenderPage(num) {
            if (isRendering) pendingPage = num;
            else renderPage(num);
        }

        function renderPage(num) {
            isRendering = true;
            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale });
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                page.render({ canvasContext: ctx, viewport }).promise.then(() => {
                    isRendering = false;
                    if (pendingPage !== null) {
                        renderPage(pendingPage);
                        pendingPage = null;
                    }
                });

                // Update UI
                inputPage.value = num;
                updateProgressBar();
                checkBookmarkState(num);
                syncProgressToBackend(num);
                
                // Extract Text
                extractAndTranslate(page, num);
            });
        }

        function updateProgressBar() {
            if(pdfDoc) {
                const pct = (pageNum / pdfDoc.numPages) * 100;
                progressBar.style.width = pct + '%';
            }
        }

        function extractAndTranslate(page, num) {
            loader.classList.add('active');
            translatedDiv.style.display = 'none';
            stopAudio();

            page.getTextContent().then(textContent => {
                let text = '';
                let lastY = null;
                textContent.items.forEach(item => {
                    if (lastY !== null && Math.abs(item.transform[5] - lastY) > 5) text += '\n\n';
                    else if (text.length > 0 && !text.endsWith(' ') && !text.endsWith('\n')) text += ' ';
                    text += item.str;
                    lastY = item.transform[5];
                });
                
                currentText = text.trim();
                
                if (currentLang === 'english') {
                    loader.classList.remove('active');
                    translatedDiv.innerText = currentText;
                    translatedDiv.style.display = 'block';
                } else {
                    fetchTranslation(num, currentText, currentLang);
                }
            });
        }

        function fetchTranslation(page, text, lang) {
            if (!text) {
                loader.classList.remove('active');
                translatedDiv.innerText = "No text found on this page.";
                translatedDiv.style.display = 'block';
                return;
            }

            fetch('/api/translate-page/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
                body: JSON.stringify({ book_id: BOOK_ID, page_number: page, english_text: text, language: lang })
            })
            .then(res => res.json())
            .then(data => {
                loader.classList.remove('active');
                translatedDiv.style.display = 'block';
                if(data.error) translatedDiv.innerHTML = `<div class="error-state">${data.error}</div>`;
                else translatedDiv.innerText = data.hindi_text;
            })
            .catch(() => {
                loader.classList.remove('active');
                translatedDiv.style.display = 'block';
                translatedDiv.innerHTML = '<div class="error-state">Network error during translation.</div>';
            });
        }

        // Backend Syncs
        function syncProgressToBackend(page) {
            fetch('/api/progress/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
                body: JSON.stringify({ book_id: BOOK_ID, current_page: page, total_pages: pdfDoc.numPages })
            });
        }

        function checkBookmarkState(page) {
            if (BOOKMARKS.includes(page)) btnBookmark.classList.add('active');
            else btnBookmark.classList.remove('active');
        }

        btnBookmark.addEventListener('click', () => {
            fetch('/api/bookmark/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
                body: JSON.stringify({ book_id: BOOK_ID, page_number: pageNum })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'added') {
                    BOOKMARKS.push(pageNum);
                    btnBookmark.classList.add('active');
                    document.getElementById('notes-drawer').classList.add('open');
                } else if (data.status === 'removed') {
                    const idx = BOOKMARKS.indexOf(pageNum);
                    if (idx > -1) BOOKMARKS.splice(idx, 1);
                    btnBookmark.classList.remove('active');
                    document.getElementById('notes-drawer').classList.remove('open');
                }
            });
        });

        document.getElementById('btn-save-note').addEventListener('click', () => {
            const note = document.getElementById('notes-input').value;
            fetch('/api/note/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
                body: JSON.stringify({ book_id: BOOK_ID, page_number: pageNum, note: note })
            }).then(() => {
                document.getElementById('notes-drawer').classList.remove('open');
            });
        });

        // Navigation Bindings
        btnPrev.addEventListener('click', () => { if(pageNum > 1) { pageNum--; queueRenderPage(pageNum); } });
        btnNext.addEventListener('click', () => { if(pdfDoc && pageNum < pdfDoc.numPages) { pageNum++; queueRenderPage(pageNum); } });
        inputPage.addEventListener('change', (e) => {
            let n = parseInt(e.target.value);
            if(n > 0 && n <= pdfDoc.numPages) { pageNum = n; queueRenderPage(pageNum); }
            else { e.target.value = pageNum; }
        });

        // Language & Theme
        document.querySelectorAll('.lang-toggle button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentLang = btn.dataset.lang;
                if(pdfDoc) queueRenderPage(pageNum); // re-translate current page
            });
        });

        document.querySelectorAll('.theme-toggle button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.theme-toggle button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.body.className = `theme-${btn.dataset.theme}`;
            });
        });

        // Fonts & Audio
        document.getElementById('btn-font-plus').addEventListener('click', () => { if(fontSize < 32) { fontSize+=2; translatedDiv.style.fontSize = fontSize+'px'; }});
        document.getElementById('btn-font-minus').addEventListener('click', () => { if(fontSize > 12) { fontSize-=2; translatedDiv.style.fontSize = fontSize+'px'; }});
        
        function stopAudio() {
            if(!audio.paused) { audio.pause(); audio.currentTime = 0; }
            document.getElementById('btn-tts').innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg> Listen`;
        }
        
        document.getElementById('btn-tts').addEventListener('click', () => {
            if(!audio.paused) { stopAudio(); return; }
            const text = translatedDiv.innerText;
            if(!text) return;
            document.getElementById('btn-tts').innerText = "Loading...";
            
            audio.play().catch(()=>{}); // Unlock Safari
            
            fetch('/api/tts/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
                body: JSON.stringify({ text: text, language: currentLang })
            }).then(r=>r.blob()).then(blob => {
                audio.src = URL.createObjectURL(blob);
                audio.play();
                document.getElementById('btn-tts').innerText = "Stop";
                audio.onended = stopAudio;
            }).catch(() => stopAudio());
        });
        
    </script>
</body>
</html>
