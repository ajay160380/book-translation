{% load socialaccount %}
<!-- Premium Dark Auth Panel -->
<style>
    .auth-overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px); z-index: 9998;
        opacity: 0; visibility: hidden;
        transition: opacity 0.4s cubic-bezier(0.77, 0, 0.175, 1), visibility 0.4s;
    }
    .auth-overlay.active { opacity: 1; visibility: visible; }

    .auth-panel {
        position: fixed; top: 0; right: -100%; width: 100%; max-width: 460px;
        height: 100vh; background: #111113; color: #f0f0f0; z-index: 9999;
        box-shadow: -20px 0 60px rgba(0,0,0,0.4);
        display: flex; flex-direction: column;
        transition: right 0.5s cubic-bezier(0.77, 0, 0.175, 1); overflow-y: auto;
        border-left: 1px solid rgba(255,255,255,0.06);
    }
    .auth-panel.active { right: 0; }

    .auth-header {
        padding: 36px 36px 24px; display: flex;
        justify-content: space-between; align-items: flex-start;
    }
    .auth-title {
        font-family: 'Clash Display', sans-serif; font-size: 36px; font-weight: 700;
        line-height: 1; letter-spacing: -0.03em; margin-bottom: 8px;
        background: linear-gradient(135deg, #8b5cf6, #06b6d4);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .auth-subtitle { font-size: 15px; color: #9ca3af; }
    .auth-close {
        background: none; border: 1px solid rgba(255,255,255,0.1); border-radius: 50%;
        width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center;
        justify-content: center; color: #9ca3af; transition: all 0.3s;
    }
    .auth-close:hover { background: rgba(255,255,255,0.05); color: #f0f0f0; transform: rotate(90deg); }

    .auth-content { padding: 0 36px 36px; flex-grow: 1; display: flex; flex-direction: column; }
    .auth-form-container { display: none; animation: authFade 0.3s ease forwards; }
    .auth-form-container.active { display: block; }
    @keyframes authFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .auth-form { display: flex; flex-direction: column; gap: 24px; margin-top: 16px; }
    .auth-field { display: flex; flex-direction: column; gap: 6px; }
    .auth-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #9ca3af; }
    .auth-input {
        background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px; padding: 14px 16px; font-family: 'Satoshi', sans-serif;
        font-size: 16px; color: #f0f0f0; outline: none; transition: all 0.3s;
    }
    .auth-input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,0.15); }
    .auth-input::placeholder { color: #4b5563; }

    .auth-submit {
        background: #8b5cf6; color: #fff; font-family: 'Satoshi', sans-serif;
        font-size: 16px; font-weight: 700; padding: 16px; border: none;
        border-radius: 12px; cursor: pointer; width: 100%; margin-top: 8px;
        transition: all 0.3s; box-shadow: 0 0 30px rgba(139,92,246,0.2);
    }
    .auth-submit:hover { background: #7c3aed; transform: translateY(-1px); box-shadow: 0 0 40px rgba(139,92,246,0.35); }

    .btn-google {
        display: flex; align-items: center; justify-content: center; gap: 12px;
        width: 100%; padding: 14px; background: rgba(255,255,255,0.04);
        color: #f0f0f0; font-family: 'Satoshi', sans-serif; font-size: 15px;
        font-weight: 700; text-align: center; border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px; cursor: pointer; margin-bottom: 20px;
        transition: all 0.3s; text-decoration: none;
    }
    .btn-google:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); }

    .social-divider {
        display: flex; align-items: center; text-align: center; margin-bottom: 20px;
        color: #6b7280; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    }
    .social-divider::before, .social-divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .social-divider:not(:empty)::before { margin-right: 12px; }
    .social-divider:not(:empty)::after { margin-left: 12px; }

    .auth-toggle { margin-top: auto; padding-top: 32px; text-align: center; font-size: 14px; color: #9ca3af; }
    .auth-toggle button {
        background: none; border: none; font-family: 'Satoshi', sans-serif; font-size: 14px;
        font-weight: 700; color: #8b5cf6; cursor: pointer; margin-left: 4px;
        transition: color 0.2s;
    }
    .auth-toggle button:hover { color: #a78bfa; }

    .auth-error {
        color: #fca5a5; font-size: 14px; font-weight: 600;
        padding: 12px 16px; border: 1px solid rgba(239,68,68,0.3);
        border-radius: 10px; margin-bottom: 20px; background: rgba(239,68,68,0.08);
    }
    .auth-tease-msg {
        background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(6,182,212,0.1));
        border: 1px solid rgba(139,92,246,0.2); border-radius: 10px;
        color: #a78bfa; padding: 14px; font-size: 14px; font-weight: 600;
        text-align: center; margin-bottom: 20px; display: none;
    }
</style>

<div class="auth-overlay" id="authOverlay"></div>
<div class="auth-panel" id="authPanel">
    <div class="auth-header">
        <div>
            <h2 class="auth-title" id="authTitle">Join Anuvad</h2>
            <p class="auth-subtitle" id="authSubtitle">Create an account to save your library.</p>
        </div>
        <button class="auth-close" id="authClose" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>

    <div class="auth-content">
        <div id="authTeaseMsg" class="auth-tease-msg">Sign in to continue reading</div>

        {% if auth_error %}
        <div class="auth-error">{{ auth_error }}</div>
        {% endif %}

        <!-- Google Auth -->
        <form action="{% provider_login_url 'google' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Continue with Google
            </button>
        </form>

        <div class="social-divider">OR</div>

        <!-- Register Form -->
        <div class="auth-form-container" id="registerFormContainer">
            <form class="auth-form" action="{% url 'register_user' %}" method="POST">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.path }}">
                <div class="auth-field">
                    <label class="auth-label" for="reg_username">Username</label>
                    <input class="auth-input" type="text" id="reg_username" name="username" required autocomplete="username" placeholder="Choose a username">
                </div>
                <div class="auth-field">
                    <label class="auth-label" for="reg_email">Email</label>
                    <input class="auth-input" type="email" id="reg_email" name="email" required autocomplete="email" placeholder="you@example.com">
                </div>
                <div class="auth-field">
                    <label class="auth-label" for="reg_password">Password</label>
                    <input class="auth-input" type="password" id="reg_password" name="password" required autocomplete="new-password" placeholder="Min 8 characters">
                </div>
                <div class="auth-field">
                    <label class="auth-label" for="reg_confirm_password">Confirm Password</label>
                    <input class="auth-input" type="password" id="reg_confirm_password" name="confirm_password" required autocomplete="new-password" placeholder="Repeat password">
                </div>
                <button type="submit" class="auth-submit">Create Account</button>
            </form>
        </div>

        <!-- Login Form -->
        <div class="auth-form-container" id="loginFormContainer">
            <form class="auth-form" action="{% url 'login_user' %}" method="POST">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.path }}">
                <div class="auth-field">
                    <label class="auth-label" for="login_username">Username</label>
                    <input class="auth-input" type="text" id="login_username" name="username" required autocomplete="username" placeholder="Your username">
                </div>
                <div class="auth-field">
                    <label class="auth-label" for="login_password">Password</label>
                    <input class="auth-input" type="password" id="login_password" name="password" required autocomplete="current-password" placeholder="Your password">
                </div>
                <button type="submit" class="auth-submit">Sign In</button>
            </form>
        </div>

        <div class="auth-toggle">
            <span id="authToggleText">Already have an account?</span>
            <button type="button" id="authToggleBtn">Log In</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const overlay = document.getElementById('authOverlay');
        const panel = document.getElementById('authPanel');
        const closeBtn = document.getElementById('authClose');
        const registerContainer = document.getElementById('registerFormContainer');
        const loginContainer = document.getElementById('loginFormContainer');
        const title = document.getElementById('authTitle');
        const subtitle = document.getElementById('authSubtitle');
        const toggleText = document.getElementById('authToggleText');
        const toggleBtn = document.getElementById('authToggleBtn');
        const teaseMsg = document.getElementById('authTeaseMsg');

        let isLogin = false;

        const serverAuthAction = "{{ auth_action|default:'register' }}";
        if (serverAuthAction === 'login') setLoginState();
        else setRegisterState();

        const hasError = "{{ auth_error|default:'' }}" !== "";
        if (hasError) openAuthPanel();

        function setLoginState() {
            isLogin = true;
            registerContainer.classList.remove('active');
            loginContainer.classList.add('active');
            title.textContent = "Welcome Back";
            subtitle.textContent = "Sign in to access your library.";
            toggleText.textContent = "Don't have an account?";
            toggleBtn.textContent = "Sign Up";
        }

        function setRegisterState() {
            isLogin = false;
            loginContainer.classList.remove('active');
            registerContainer.classList.add('active');
            title.textContent = "Join Anuvad";
            subtitle.textContent = "Create an account to save your library.";
            toggleText.textContent = "Already have an account?";
            toggleBtn.textContent = "Sign In";
        }

        toggleBtn.addEventListener('click', () => { if (isLogin) setRegisterState(); else setLoginState(); });

        function openAuthPanel(customMessage = null) {
            overlay.classList.add('active');
            panel.classList.add('active');
            if (customMessage) { teaseMsg.style.display = 'block'; teaseMsg.textContent = customMessage; }
            else { teaseMsg.style.display = 'none'; }
            // If message contains "LOG IN", show login
            if (customMessage && customMessage.toUpperCase().includes('LOG IN')) setLoginState();
            else if (customMessage && customMessage.toUpperCase().includes('CREATE')) setRegisterState();
        }

        function closeAuthPanel() {
            if (window.authTeaseEnforced) return;
            overlay.classList.remove('active');
            panel.classList.remove('active');
            const rc = document.querySelector('.reader-container');
            if (rc) rc.style.filter = 'none';
        }

        closeBtn.addEventListener('click', closeAuthPanel);
        overlay.addEventListener('click', () => { if (!window.authTeaseEnforced) closeAuthPanel(); });

        window.openAuthPanel = openAuthPanel;
        window.closeAuthPanel = closeAuthPanel;
    });
</script>
